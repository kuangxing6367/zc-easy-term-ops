name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    # 工具箱本体依赖 bash 4+（关联数组 / mapfile / local -n / ${var,,}），
    # 所以不跑 macOS 自带 bash 3.2 —— 那是必然红，测不出东西。
    name: bash on ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 纯 Bash 零依赖；这里只补测试与静态检查需要的工具。
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Show environment
        run: |
          bash --version | head -1
          uname -a

      # 最低版本守卫：README 声明需要 bash 4.0+，用语法开关显式断言，
      # 避免有人在 3.2 上跑出满屏语法错却归因于"脚本坏了"。
      - name: Assert bash >= 4.0
        shell: bash
        run: |
          if (( BASH_VERSINFO[0] < 4 )); then
            echo "::error::需要 bash 4.0+，当前 $BASH_VERSION"
            exit 1
          fi

      # 换行符守卫：Windows 上编辑过的 .sh 若带 CRLF，Linux 上会 bad interpreter。
      - name: Reject CRLF in shell scripts
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::file contains CRLF line endings"
              bad=1
            fi
          done < <(git ls-files '*.sh' 'install.sh')
          exit $bad

      # 可执行位守卫：Windows 上 git 无 exec 概念，脚本很容易被提交成 100644，
      # clone 到 Linux 后 ./install.sh 直接 Permission denied。
      - name: Assert shell scripts are executable
        shell: bash
        run: |
          bad=$(git ls-files -s '*.sh' 'install.sh' | awk '$1!="100755"{print $4}')
          if [ -n "$bad" ]; then
            echo "以下脚本缺少可执行位："
            echo "$bad"
            echo "::error::修复：git update-index --chmod=+x <文件>"
            exit 1
          fi

      - name: Syntax check (bash -n)
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.sh' 'install.sh')
          exit $fail

      - name: shellcheck (advisory)
        continue-on-error: true
        shell: bash
        run: |
          shellcheck -S warning -f gcc $(git ls-files '*.sh' 'install.sh') | tee shellcheck.log
          echo "shellcheck 警告数: $(wc -l < shellcheck.log)"

      - name: Run test suite
        shell: bash
        run: bash tests/run_tests.sh

      # 守住的正是 CLI 改造新加的子命令入口：模块菜单派生、动作表、下钻寻址。
      - name: Smoke test CLI
        shell: bash
        run: |
          bash core/main.sh --version
          bash core/main.sh --list
          bash core/main.sh --list hardware_info
          bash core/main.sh hardware_info 1 >/dev/null
